[project]
name = "mania-skin-classifier"
version = "0.1.0"
description = "Classify osu!mania skins by note shape and cut (Percy) long notes per key mode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "pypng>=0.20220715",
]

[project.scripts]
mania-skin-classify = "mania_skin_classifier.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mania_skin_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
